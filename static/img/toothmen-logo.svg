<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- 牙齿形状的logo -->
  <defs>
    <linearGradient id="toothGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2E7D32;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="toothGradientDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#81C784;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#388E3C;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 背景圆形 -->
  <circle cx="100" cy="100" r="90" fill="url(#toothGradient)" stroke="#2E7D32" stroke-width="2"/>
  
  <!-- 牙齿形状 -->
  <path d="M80,70 Q100,50 120,70 L120,120 Q100,140 80,120 Z" fill="white" stroke="#BDBDBD" stroke-width="2"/>
  
  <!-- 牙齿分割线 -->
  <path d="M100,70 L100,120" stroke="#E0E0E0" stroke-width="1.5"/>
  <path d="M90,75 L110,75" stroke="#E0E0E0" stroke-width="1"/>
  <path d="M90,115 L110,115" stroke="#E0E0E0" stroke-width="1"/>
  
  <!-- 公司名称缩写 TM -->
  <text x="100" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="white">TM</text>
</svg>