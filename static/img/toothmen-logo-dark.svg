<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- 牙齿形状的logo - 深色版本 -->
  <defs>
    <linearGradient id="toothGradientDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1B5E20;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0D3B0D;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 背景圆形 -->
  <circle cx="100" cy="100" r="90" fill="url(#toothGradientDark)" stroke="#1B5E20" stroke-width="2"/>
  
  <!-- 牙齿形状 -->
  <path d="M80,70 Q100,50 120,70 L120,120 Q100,140 80,120 Z" fill="#F5F5F5" stroke="#757575" stroke-width="2"/>
  
  <!-- 牙齿分割线 -->
  <path d="M100,70 L100,120" stroke="#9E9E9E" stroke-width="1.5"/>
  <path d="M90,75 L110,75" stroke="#9E9E9E" stroke-width="1"/>
  <path d="M90,115 L110,115" stroke="#9E9E9E" stroke-width="1"/>
  
  <!-- 公司名称缩写 TM -->
  <text x="100" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#E0E0E0">TM</text>
</svg>